<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#14131a" />
    <title>Page not found | Tejas Mane</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #14131a; color: #efefef; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 520px); text-align: center; }
      .terminal { margin: 0 auto 28px; overflow: hidden; border: 1px solid #383742; border-radius: 12px; background: #0c0b12; box-shadow: 0 8px 32px #0008; text-align: left; }
      .bar { display: flex; align-items: center; gap: 7px; padding: 11px 13px; border-bottom: 1px solid #282730; color: #777684; font: 12px ui-monospace, monospace; }
      .bar span { width: 8px; height: 8px; border-radius: 50%; background: #f87171; }
      .bar span:nth-child(2) { background: #fbbf24; }
      .bar span:nth-child(3) { background: #4ade80; }
      .bar code { margin-left: auto; }
      .prompt { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 16px; font: 14px ui-monospace, monospace; }
      .prompt strong { color: #a5b4fc; }
      .cursor { width: 7px; height: 17px; background: #efefef; animation: blink 1s steps(2, start) infinite; }
      h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 40px); }
      p { margin: 0 0 24px; color: #aaa9b6; }
      a { display: inline-block; padding: 10px 18px; border: 1px solid #55545e; border-radius: 9px; color: #fff; text-decoration: none; }
      a:hover { background: #24232c; }
      @keyframes blink { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="terminal" aria-hidden="true">
        <div class="bar"><span></span><span></span><span></span><code>tejas@portfolio:~</code></div>
        <div class="prompt"><strong>&gt;_</strong><code>route not found</code><i class="cursor"></i></div>
      </div>
      <h1>404 — Page not found</h1>
      <p>The link may be outdated, or the address may be mistyped.</p>
      <a href="/">Back to Home</a>
    </main>
  </body>
</html>
